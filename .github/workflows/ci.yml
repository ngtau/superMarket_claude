name: CI

# ⚠️历史遗留说明：本目录曾在上游提交 79ba3f5 中被整体删除（rm .github），
# 导致 README 声称的"PR 必过 CI"门禁实际不存在。本文件为重建版本，
# 并补齐了此前从未真正存在过的 E2E job。

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 package.json 的 packageManager 保持一致，避免 corepack 拉取另一个大版本
  PNPM_VERSION: 9.15.9

jobs:
  # ---------- 1. 静态门禁：类型检查 + 构建 + 单测 ----------
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  # ---------- 2. 端到端门禁：真实 Postgres 上跑主链路 ----------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apcube
          POSTGRES_PASSWORD: apcube
          POSTGRES_DB: apcube
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apcube"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://apcube:apcube@127.0.0.1:5432/apcube
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      # APP_ENCRYPTION_KEY 必须为 64 位 hex（AES-256），仅 CI 使用
      APP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CLIENT_ORIGIN: http://127.0.0.1:5173
      ADMIN_ORIGIN: http://127.0.0.1:5173
      E2E_API_BASE: http://127.0.0.1:3000
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed system data (roles / permissions / admin)
        run: pnpm db:seed

      - name: Seed demo catalog (E2E fixtures)
        run: pnpm db:seed:demo

      - name: Install Playwright browsers
        run: pnpm --filter @app/client e2e:install

      - name: Run E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/client/playwright-report/
          retention-days: 7
